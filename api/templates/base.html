<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Web Programming - Group CW </title>
</head>

<body>
    <div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="row g-0 bg-light w-75 shadow rounded" style="height: 46rem;">
            <div class="col-7 d-flex flex-column justify-content-center align-items-stretch rounded-start p-5">
                <div>
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
            <div class="col-5 rounded-end bg-warning">
                {% load static %}
                <img class="w-100 h-100 object-fit-cover rounded-end" src="{% static 'api/auth/auction_hammer.jpg' %}" alt="background picture of hammer for auction">
            </div>
        </div>
    </div>
</body>
</html>
